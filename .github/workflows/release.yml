name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write   # create the GitHub release
  packages: write   # push images to ghcr.io

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: mancar
          POSTGRES_PASSWORD: testpw
          POSTGRES_DB: mancar_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U mancar -d mancar_test"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      TEST_DATABASE_URL: postgres://mancar:testpw@127.0.0.1:5432/mancar_test?sslmode=disable
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: go test -race -count=1 -timeout 15m ./...

  binaries:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: make dist VERSION=${{ github.ref_name }}
      # The release description is this tag's section of CHANGELOG.md; a tag
      # without one fails here, before anything is published.
      - name: release notes from CHANGELOG.md
        env:
          TAG: ${{ github.ref_name }}
        run: |
          awk -v tag="$TAG" '
            $0 ~ "^## \\[" tag "\\]" { on = 1; next }
            on && (/^## \[/ || /^\[v/) { exit }
            on { print }
          ' CHANGELOG.md > notes.md
          if ! grep -q '[^[:space:]]' notes.md; then
            echo "::error::CHANGELOG.md has no section for $TAG; add '## [$TAG] - date' before tagging"
            exit 1
          fi
          prev=$(git describe --tags --abbrev=0 "$TAG^" 2>/dev/null || true)
          if [ -n "$prev" ]; then
            printf '\n**Full changelog**: %s/compare/%s...%s\n' "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" "$prev" "$TAG" >> notes.md
          fi
          cat notes.md
      - uses: softprops/action-gh-release@v3
        with:
          files: dist/*
          body_path: notes.md

  images:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: gateway
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          # 1.2.3, 1.2 and latest (latest only for real releases, not v1.2.3-rc1)
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ !contains(github.ref_name, '-') }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          build-args: VERSION=${{ github.ref_name }}
          tags: ${{ steps.gateway.outputs.tags }}
          labels: ${{ steps.gateway.outputs.labels }}
      - id: edge
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}-edge
          # 1.2.3, 1.2 and latest (latest only for real releases, not v1.2.3-rc1)
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ !contains(github.ref_name, '-') }}
      - uses: docker/build-push-action@v7
        with:
          context: docker/caddy
          push: true
          tags: ${{ steps.edge.outputs.tags }}
          labels: ${{ steps.edge.outputs.labels }}
