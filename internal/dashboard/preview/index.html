<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>mancar dashboard preview</title>
<!--
  UI preview for tuning the dashboard: the real static/style.css and
  static/app.js with fake data, no gateway and no login. Never embedded in the
  binary (only static/ is). Run: make dashboard-preview
  Theme: ?theme=light | ?theme=dark | (none) follows the system.
  Role: ?as=admin (default) | user | unverified | guest (sign in and sign up)
  | setup (a fresh gateway: create the first admin).
  Private tunnel: "Open" on lunar-panther (Tunnels) shows the Restricted
  page a signed-out visitor gets. "Log in to continue": as tino (the owner)
  you get in, as admin you are back on the Restricted page.
  ?click=N opens the Nth clickable row, e.g. a detail sheet.
-->
<script src="mock.js"></script>
<script>
  // ?theme=light|dark|system is stored the way the dashboard's own theme
  // switcher stores it, then theme.js applies it.
  const theme = new URLSearchParams(location.search).get("theme");
  if (theme) { try { localStorage.setItem("mancar-theme", theme); } catch {} }
</script>
<script src="../static/theme.js"></script>
<link rel="stylesheet" href="../static/style.css">
<script src="../static/app.js" defer></script>
<script>
  // ?click=N opens the Nth clickable row (detail sheet) once the page renders.
  const n = Number(new URLSearchParams(location.search).get("click"));
  if (n) setTimeout(() => { const c = document.querySelectorAll("main .cell.clickable")[n - 1]; if (c) c.click(); }, 900);
</script>
</head>
<body>
<div id="app"></div>
<nav class="preview-bar" aria-label="Preview">
  as:
  <a href="?as=admin">admin</a>
  <a href="?as=user">user</a>
  <a href="?as=unverified">unverified</a>
  <a href="?as=guest">sign in / up</a>
  <a href="?as=setup">first run</a>
  · private tunnel:
  <a href="restricted.html">restricted</a>
  <a href="?as=guest#ref=lunar-panther.labsdigitalside.my.id%2F">log in</a>
  <a href="?as=user#ref=lunar-panther.labsdigitalside.my.id%2F">allowed</a>
  · theme:
  <a href="?theme=light">light</a>
  <a href="?theme=dark">dark</a>
</nav>
<script>
  // Switching one preview setting keeps the other (as=… keeps theme, and
  // back) and the open page (#tunnels); a link with its own #… uses that.
  // Worked out on click, so it follows the page as it is now, and the same
  // address reloads instead of doing nothing.
  function previewTarget(a) {
    const link = new URL(a.getAttribute("href"), location.href);
    if (link.pathname !== location.pathname) return link.href; // another preview page
    const next = new URLSearchParams(location.search);
    for (const [k, v] of link.searchParams) next.set(k, v);
    const view = /^#[a-z]+$/.test(location.hash) ? location.hash : "";
    return location.pathname + "?" + next + (link.hash || view);
  }
  // There is no real tunnel behind the preview: "Open" on the private one
  // shows the Restricted page the gateway gives a signed-out visitor.
  document.addEventListener("click", (e) => {
    const a = e.target.closest('a[href^="https://lunar-panther."]');
    if (!a) return;
    e.preventDefault();
    location.assign("restricted.html?host=" + encodeURIComponent(new URL(a.href).host));
  }, true); // capture: the Open button stops the click from reaching its row
  document.querySelector(".preview-bar").addEventListener("click", (e) => {
    const a = e.target.closest("a");
    if (!a) return;
    e.preventDefault();
    const url = previewTarget(a);
    if (url === location.pathname + location.search + location.hash) location.reload();
    else if (url.split("#")[0] === location.pathname + location.search) location.hash = url.split("#")[1] || "";
    else location.assign(url);
  });
</script>
<style>
  /* preview chrome only: not part of the design system */
  .preview-bar { position: fixed; right: 8px; bottom: 8px; z-index: 99; font: 12px system-ui; padding: 4px 8px;
    border-radius: 6px; background: rgb(0 0 0 / .65); color: #fff; display: flex; gap: 8px; }
  .preview-bar a { color: #9cc0ff; }
</style>
</body>
</html>
