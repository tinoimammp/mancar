<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Restricted · {{.Host}}</title>
<style>
  /* Served by the gateway on a private tunnel's own host, so the styles are
     inline (nothing is loaded from the app behind the tunnel; the logo comes
     from the dashboard). It copies the dashboard's sign in card: the values
     below are static/style.css tokens (.login, .login-card, .brand,
     .check-email, .btn.primary). */
  :root {
    --bg: oklch(0.982 0.003 262); --surface: oklch(1 0 262); --fill: oklch(0.955 0.007 262);
    --text: oklch(0.220 0.018 262); --text-2: oklch(0.460 0.018 262);
    --tint: oklch(0.500 0.191 262); --tint-hover: oklch(0.430 0.171 262); --tint-pressed: oklch(0.360 0.145 262);
    --on-tint: oklch(1 0 262); --shadow: 262 60% 20%;
    --text-footnote: 0.75rem; --text-subheadline: 0.8125rem; --text-callout: 0.875rem; --text-title2: 1.25rem;
    --control-h-lg: 44px;
    color-scheme: light dark;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: oklch(0.135 0.010 262); --surface: oklch(0.205 0.014 262); --fill: oklch(0.250 0.016 262);
      --text: oklch(0.955 0.007 262); --text-2: oklch(0.780 0.012 262);
      --tint: oklch(0.680 0.167 262); --tint-hover: oklch(0.780 0.111 262); --tint-pressed: oklch(0.870 0.063 262);
      --on-tint: oklch(0.210 0.081 262); --shadow: 262 50% 3%;
    }
  }
  @media (pointer: coarse), (max-width: 1080px) {
    :root { --text-footnote: 0.8125rem; --text-subheadline: 0.9375rem; --text-callout: 1rem; --text-title2: 1.375rem; --control-h-lg: 52px; }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    background: var(--bg); color: var(--text); letter-spacing: -0.005em; -webkit-font-smoothing: antialiased;
    font: var(--text-callout) / 1.4 -apple-system, system-ui, "Segoe UI", Roboto, sans-serif;
  }
  h1 { margin: 0; }
  .login { min-height: 100vh; display: grid; place-items: center; padding: 16px; }
  .login-card {
    width: 100%; max-width: 480px; background: var(--surface); border-radius: 24px; padding: 32px;
    box-shadow: 0 1px 2px hsl(var(--shadow) / 0.04), 0 8px 24px hsl(var(--shadow) / 0.05);
  }
  .brand { display: flex; align-items: center; gap: 12px; margin-bottom: 24px; }
  .mark { width: 40px; height: 40px; border-radius: 50%; flex: none; background: var(--tint) url("{{.Logo}}") center / cover no-repeat; }
  .brand-text { display: grid; line-height: 1.2; }
  .brand-name { font-weight: 600; font-size: var(--text-callout); }
  .brand-sub { font-size: var(--text-footnote); color: var(--text-2); }
  .check-email { display: grid; justify-items: center; text-align: center; gap: 12px; margin-bottom: 8px; }
  .check-icon { width: 64px; height: 64px; border-radius: 50%; display: grid; place-items: center; background: var(--fill); color: var(--text-2); }
  .check-title { font-size: var(--text-title2); font-weight: 700; letter-spacing: -0.02em; }
  .auth-note { margin: 0 0 16px; font-size: var(--text-subheadline); color: var(--text-2); line-height: 1.5; overflow-wrap: anywhere; }
  .auth-note strong { color: var(--text); font-weight: 600; }
  .btn {
    display: flex; align-items: center; justify-content: center; width: 100%; min-height: var(--control-h-lg); padding: 0 24px;
    border-radius: 999px; background: var(--tint); color: var(--on-tint); font-size: var(--text-callout); font-weight: 600;
    line-height: 1; text-decoration: none; transition: background-color 120ms ease-out, transform 120ms ease-out;
  }
  .btn:hover { background: var(--tint-hover); }
  .btn:active { background: var(--tint-pressed); transform: scale(0.97); }
  .btn:focus-visible { outline: 2px solid var(--tint); outline-offset: 2px; }
</style>
</head>
<body>
<div class="login">
  <main class="login-card">
    <div class="brand">
      <span class="mark" aria-hidden="true"></span>
      <span class="brand-text"><span class="brand-name">mancar</span><span class="brand-sub">Private tunnel</span></span>
    </div>
    <div class="check-email">
      <span class="check-icon" aria-hidden="true">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 11h14v10H5zM8 11V7a4 4 0 0 1 8 0v4"/></svg>
      </span>
      <h1 class="check-title">Restricted</h1>
      <p class="auth-note"><strong>{{.Host}}</strong> is private. Log in with an account that has access.</p>
    </div>
    <a class="btn" href="{{.SignIn}}">Log in to continue</a>
  </main>
</div>
</body>
</html>
