# mancar: gateway + PgBouncer + PostgreSQL + TLS edge.
#
#   cp .env.example .env && ./scripts/setup.sh
#   docker compose up -d
#
# Only the edge (80, 443) and the TCP tunnel port range are published.
# PostgreSQL, PgBouncer and the gateway's HTTP port are reachable only on the internal
# Docker network.

name: mancar

services:
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: "${POSTGRES_USER:-mancar}"
      POSTGRES_DB: "${POSTGRES_DB:-mancar}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required: run scripts/setup.sh or see .env.example}"
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    security_opt:
      - no-new-privileges:true
    logging: &logging
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    networks: [internal]

  # Connection pooler between the gateway and PostgreSQL, in transaction
  # pooling mode: many client connections share a few server connections,
  # which keeps PostgreSQL's memory small. Backups and restores talk to the
  # postgres service directly (pg_dump and a one-transaction restore do not
  # belong behind a transaction pooler).
  pgbouncer:
    image: edoburu/pgbouncer:v1.26.1-p0
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_HOST: postgres
      DB_USER: "${POSTGRES_USER:-mancar}"
      DB_PASSWORD: "${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}"
      DB_NAME: "${POSTGRES_DB:-mancar}"
      AUTH_TYPE: scram-sha-256
      POOL_MODE: transaction
      MAX_CLIENT_CONN: "200"
      DEFAULT_POOL_SIZE: "${PGBOUNCER_POOL_SIZE:-10}"
      STATS_USERS: "${POSTGRES_USER:-mancar}"     # SHOW POOLS / SHOW STATS, read-only
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -p 5432 -U $${DB_USER} -d $${DB_NAME}"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    logging: *logging
    networks: [internal]

  gateway:
    # Released images only: nothing is compiled on the server. A version
    # that does not exist (a typo, "v0.6.0" instead of "0.6.0", a release
    # still being built) fails here and leaves the running gateway alone.
    # To run your own build: make docker, then MANCAR_IMAGE=mancar
    # MANCAR_EDGE_IMAGE=mancar-edge MANCAR_VERSION=<version>
    # MANCAR_PULL_POLICY=never docker compose up -d
    image: ${MANCAR_IMAGE:-ghcr.io/tinoimammp/mancar}:${MANCAR_VERSION:-latest}
    # "always": every "docker compose up" checks the registry, so
    # MANCAR_VERSION=latest picks up new releases. A pinned version that is
    # already present is not downloaded again.
    pull_policy: ${MANCAR_PULL_POLICY:-always}
    restart: unless-stopped
    depends_on:
      pgbouncer:
        condition: service_healthy
    environment:
      APP_ENV: "${APP_ENV:-production}"
      BASE_DOMAIN: "${BASE_DOMAIN:?BASE_DOMAIN is required (see .env.example)}"
      LISTEN_ADDR: ":8080"
      PUBLIC_SCHEME: https
      STORAGE: postgres
      POSTGRES_HOST: pgbouncer              # through the connection pooler
      POSTGRES_USER: "${POSTGRES_USER:-mancar}"
      POSTGRES_DB: "${POSTGRES_DB:-mancar}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}"
      JWT_SECRET: "${JWT_SECRET:?JWT_SECRET is required: run scripts/setup.sh}"
      ENCRYPTION_KEY: "${ENCRYPTION_KEY:?ENCRYPTION_KEY is required: run scripts/setup.sh}"
      LOG_LEVEL: "${LOG_LEVEL:-info}"
      TCP_PORT_RANGE: "${TCP_PORT_MIN:-20000}-${TCP_PORT_MAX:-20099}"
      MAX_TUNNELS_PER_AGENT: "${MAX_TUNNELS_PER_AGENT:-}"
      MAX_AGENTS_PER_USER: "${MAX_AGENTS_PER_USER:-}"
      MAX_CONNECTIONS_PER_TUNNEL: "${MAX_CONNECTIONS_PER_TUNNEL:-}"
      MAX_REQUEST_BODY_BYTES: "${MAX_REQUEST_BODY_BYTES:-}"
      RESPONSE_HEADER_TIMEOUT: "${RESPONSE_HEADER_TIMEOUT:-}"
      HOSTNAME_HOLD_CUSTOM: "${HOSTNAME_HOLD_CUSTOM:-}"
      HOSTNAME_HOLD_RANDOM: "${HOSTNAME_HOLD_RANDOM:-}"
      AUTH_FAILURE_LIMIT_PER_MINUTE: "${AUTH_FAILURE_LIMIT_PER_MINUTE:-}"
      MAX_TCP_TUNNELS_PER_USER: "${MAX_TCP_TUNNELS_PER_USER:-}"
      TRUSTED_PROXIES: "${TRUSTED_PROXIES:-}"
      INSPECT: "${INSPECT:-}"
      INSPECT_RETENTION: "${INSPECT_RETENTION:-}"
      INSPECT_MAX_BODY_BYTES: "${INSPECT_MAX_BODY_BYTES:-}"
      INSPECT_MAX_ROWS: "${INSPECT_MAX_ROWS:-}"
      REGISTER_ENABLED: "${REGISTER_ENABLED:-}"
      SMTP_URL: "${SMTP_URL:-}"
    # TCP tunnels listen on this range inside the container; publish the same
    # range. Narrow TCP_PORT_MIN/TCP_PORT_MAX if you need few tunnels: Docker
    # starts one proxy per published port.
    ports:
      - "${TCP_PORT_MIN:-20000}-${TCP_PORT_MAX:-20099}:${TCP_PORT_MIN:-20000}-${TCP_PORT_MAX:-20099}"
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 30s
    logging: *logging
    networks: [internal]

  caddy:
    image: ${MANCAR_EDGE_IMAGE:-ghcr.io/tinoimammp/mancar-edge}:${MANCAR_VERSION:-latest}
    pull_policy: ${MANCAR_PULL_POLICY:-always}
    restart: unless-stopped
    depends_on:
      gateway:
        condition: service_healthy
    environment:
      BASE_DOMAIN: "${BASE_DOMAIN:?BASE_DOMAIN is required (see .env.example)}"
      ACME_EMAIL: "${ACME_EMAIL:?ACME_EMAIL is required (see .env.example)}"
      CLOUDFLARE_API_TOKEN: "${CLOUDFLARE_API_TOKEN:?CLOUDFLARE_API_TOKEN is required (see .env.example)}"
      ACME_CA: "${ACME_CA:-https://acme-v02.api.letsencrypt.org/directory}"
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - caddy_data:/data      # certificates and the ACME account: keep this volume
      - caddy_config:/config
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:2019/config/"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt:
      - no-new-privileges:true
    logging: *logging
    networks: [internal]

networks:
  internal:

volumes:
  pgdata:
  caddy_data:
  caddy_config:
