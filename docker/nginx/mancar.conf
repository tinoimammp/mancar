# nginx site for mancar (see docs/NGINX.md).
# Replace every tunnel.example.com with your BASE_DOMAIN, then:
#   sudo cp docker/nginx/mancar.conf /etc/nginx/sites-available/mancar
#   sudo ln -s /etc/nginx/sites-available/mancar /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx

# Agents connect with "Upgrade: mancar/1" and tunnels carry WebSockets; pass
# any upgrade through, and close the upstream connection otherwise.
map $http_upgrade $mancar_connection {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    listen [::]:80;
    server_name tunnel.example.com *.tunnel.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name tunnel.example.com *.tunnel.example.com;

    # Wildcard certificate from certbot's Cloudflare DNS plugin.
    ssl_certificate     /etc/letsencrypt/live/tunnel.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/tunnel.example.com/privkey.pem;

    # The gateway enforces MAX_REQUEST_BODY_BYTES itself.
    client_max_body_size 0;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $mancar_connection;
        # Overwrite (never append) so clients cannot spoof their address.
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;

        # Stream both ways: server-sent events, long polling, large uploads.
        proxy_buffering         off;
        proxy_request_buffering off;

        # Agent sessions and tunnelled streams may stay open for hours.
        proxy_connect_timeout 5s;
        proxy_read_timeout    1d;
        proxy_send_timeout    1d;
    }
}
