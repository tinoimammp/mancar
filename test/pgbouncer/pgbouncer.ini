; PgBouncer for CI: the PostgreSQL tests run through it once more, in the
; same transaction pooling mode docker-compose.yml uses, to prove the store
; works behind a transaction pooler. search_path is tracked because the
; tests give each test its own schema through it.
[databases]
* = host=127.0.0.1 port=5432

[pgbouncer]
listen_addr = 127.0.0.1
listen_port = 6432
unix_socket_dir =
auth_type = scram-sha-256
auth_file = /cfg/userlist.txt
pool_mode = transaction
max_client_conn = 500
default_pool_size = 20
ignore_startup_parameters = extra_float_digits
track_extra_parameters = search_path
